<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aevum — Friction Positive & Déconnexion Consciente</title>
  <meta name="description" content="Découvrez le premier bouclier de longévité numérique utilisant la Screen Time API native d'Apple.">
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <style>
    :root {
      --bg: #09090B;
      --card: #121216;
      --accent: #E6392F;
      --text: #F4F4F5;
      --text-muted: #A1A1AA;
      --border: #272732;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .hero-card {
      max-width: 580px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(230, 57, 47, 0.12);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      line-height: 1.2;
      margin: 0 0 16px 0;
      font-weight: 700;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .cta-btn {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .cta-btn:hover {
      background: #B91C1C;
    }
  </style>
</head>
<body>
  <div class="hero-card">
    <div class="tag">Protocole de Frictions Positives</div>
    <h1>Reprenez le Contrôle de Votre Attention</h1>
    <p>30 secondes d'intervention physiologique au moment exact où vous ouvrez une application chronophage. Validé par les neurosciences et la Screen Time API.</p>
    <a href="#demo" class="cta-btn" id="cta-hero-download" onclick="dataLayer.push({'event': 'click_cta', 'cta_id': 'hero_download'});">Accéder au Simulateur</a>
  </div>
</body>
</html>
