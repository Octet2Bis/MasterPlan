<!-- Pulsing Orb View Component — Web Preview (Essential 7) -->
<div class="pulsing-orb-container" style="position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center;">
  <div class="orb-halo" style="position: absolute; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(56, 189, 248, 0) 70%); animation: orbPulse 3.5s ease-in-out infinite alternate;"></div>
  <div class="orb-core" style="width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #38BDF8 20%, rgba(56, 189, 248, 0.4) 100%); box-shadow: 0 0 24px rgba(56, 189, 248, 0.6); animation: orbScale 3.5s ease-in-out infinite alternate;"></div>
</div>
<style>
@keyframes orbPulse { from { transform: scale(0.9); opacity: 0.5; } to { transform: scale(1.3); opacity: 0.9; } }
@keyframes orbScale { from { transform: scale(0.85); } to { transform: scale(1.15); } }
</style>
