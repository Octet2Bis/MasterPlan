<!-- Segmented Pill Control Component — Web Preview (Essential 7) -->
<div class="segmented-pill-container" style="display: inline-flex; background: var(--surface-1, #151B28); padding: 4px; border-radius: 999px; border: 1px solid var(--border-subtle, rgba(255,255,255,0.08)); gap: 4px;">
  <button class="pill-btn active" data-index="0" style="border: none; background: #F8FAFC; color: #0B0F17; font-weight: 700; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease;">Jour</button>
  <button class="pill-btn" data-index="1" style="border: none; background: transparent; color: #94A3B8; font-weight: 600; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease;">Semaine</button>
  <button class="pill-btn" data-index="2" style="border: none; background: transparent; color: #94A3B8; font-weight: 600; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease;">Mois</button>
</div>
