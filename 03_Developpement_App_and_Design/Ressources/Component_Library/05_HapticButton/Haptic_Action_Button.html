<!-- Haptic Action Button Component — Web Preview (Essential 7) -->
<button class="btn-haptic-action" style="width: 100%; background: var(--accent-main, #F59E0B); color: #000000; font-weight: 700; font-size: 14px; padding: 14px 20px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 12px rgba(245, 158, 11, 0.25); transition: transform 0.1s ease, background-color 0.15s ease;" onmousedown="this.style.transform='scale(0.97)'" onmouseup="this.style.transform='scale(1)'" onclick="if (navigator.vibrate) navigator.vibrate(20);">
  <span>⚡</span>
  <span>Démarrer le Protocole</span>
</button>
