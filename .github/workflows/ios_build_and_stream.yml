name: iOS Cloud Build & Stream (Appetize.io)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nom du dossier app dans apps/'
        required: true
        default: 'aevum_ios'
      xcode_version:
        description: 'Version de Xcode'
        required: true
        default: '15.4'

jobs:
  build-simulator:
    name: Build iOS Simulator (.app) sur macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sélectionner Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ github.event.inputs.xcode_version }}.app/Contents/Developer
          xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le Projet Xcode
        run: |
          cd 03_Developpement_App/apps/${{ github.event.inputs.app_name }}
          if [ -f "project.yml" ]; then
            xcodegen generate
          else
            echo "🚨 Aucun fichier project.yml trouvé dans ${{ github.event.inputs.app_name }}"
            exit 1
          fi

      - name: Compiler le Binaire iOS Simulator
        run: |
          cd 03_Developpement_App/apps/${{ github.event.inputs.app_name }}
          APP_NAME=$(basename $(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1) .xcodeproj)
          
          xcodebuild build \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Localisation du bundle .app
          APP_BUNDLE=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "🚨 Bundle .app introuvable !"
            exit 1
          fi
          
          cd $(dirname "$APP_BUNDLE")
          zip -r -y "${APP_NAME}_simulator.zip" $(basename "$APP_BUNDLE")
          mv "${APP_NAME}_simulator.zip" $GITHUB_WORKSPACE/

      - name: Sauvegarder le Binaire Simulator (Artifact GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-simulator-app
          path: ${{ github.workspace }}/*_simulator.zip
          retention-days: 14

      - name: Déployer sur Appetize.io (Optionnel avec Secret)
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          ZIP_FILE=$(find $GITHUB_WORKSPACE -name "*_simulator.zip" | head -n 1)
          if [ -n "$APPETIZE_TOKEN" ] && [ -f "$ZIP_FILE" ]; then
            echo "🚀 Upload vers l'API Appetize.io..."
            RESPONSE=$(curl -s "https://${APPETIZE_TOKEN}@api.appetize.io/v2/apps" \
              -F "file=@${ZIP_FILE}" \
              -F "platform=ios")
            PUBLIC_KEY=$(echo "$RESPONSE" | grep -o '"publicKey":"[^"]*' | cut -d'"' -f4)
            if [ -n "$PUBLIC_KEY" ]; then
              echo "### 📱 Émulateur iOS Live (Appetize.io) :" >> $GITHUB_STEP_SUMMARY
              echo "👉 **[Ouvrir l'application dans votre navigateur](https://appetize.io/embed/${PUBLIC_KEY}?device=iphone14&osVersion=17.5&scale=85)**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### 📱 Binaire iOS Simulator Compilé avec Succès !" >> $GITHUB_STEP_SUMMARY
            echo "1. Téléchargez l'artefact **${{ github.event.inputs.app_name }}-simulator-app** ci-dessous." >> $GITHUB_STEP_SUMMARY
            echo "2. Glissez-déposez le fichier `.zip` directement sur [appetize.io/upload](https://appetize.io/upload) (gratuit sans compte) pour tester l'app dans votre navigateur." >> $GITHUB_STEP_SUMMARY
          fi
