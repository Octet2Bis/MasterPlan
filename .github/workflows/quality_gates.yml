name: Master Plan Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-audit:
    name: Deterministic Quality Gates & Monolith Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Master Quality Gates (Integrity, DAG, 4 Portes & Assistant)
        run: |
          node 03_Developpement_App_and_Design/toolbox/test_code_integrity.js
          node 03_Developpement_App_and_Design/toolbox/dag_validator.js
          node 03_Developpement_App_and_Design/toolbox/gatekeeper.js --check
          node 02_Assistant_Personnel/toolbox/test_meeting_ingestor.js
          node 01_GTM_Growth/toolbox/core/aeo_graph_auditor.js

      - name: Set up Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GTM & Architecture Health Checks
        env:
          PYTHONPATH: 01_GTM_Growth
        run: |
          python 01_GTM_Growth/toolbox/tests/test_quality_gates.py
          python 01_GTM_Growth/toolbox/tests/test_analytics_suite.py
