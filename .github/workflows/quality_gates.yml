name: Master Plan Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-audit:
    name: Deterministic Quality Gates & Monolith Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run App Dev Quality Gate (< 250 lines & Zero Inlining)
        run: |
          node 03_Developpement_App/toolbox/test_code_integrity.js

      - name: Set up Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GTM & Architecture Health Checks
        run: |
          python 01_GTM_Growth/toolbox/test_quality_gates.py
